# Chameleon Store Studio documentation site, built with Zensical (https://zensical.org).
#
# Local preview (Python 3.11+):
#   python3 -m venv .venv && source .venv/bin/activate
#   pip install -r docs/requirements.txt
#   ./scripts/docs.sh serve      # Live preview
#   ./scripts/docs.sh build      # Build static site under site/

site_name: Chameleon Store Studio
site_url: https://ribod.github.io/chameleon-store-studio/
site_description: "Store screenshots as code for Jetpack Compose and Compose Multiplatform: render, export, validate, review and publish Google Play and App Store assets."
site_author: ribod
repo_name: ribod/chameleon-store-studio
repo_url: https://github.com/ribod/chameleon-store-studio
edit_uri: edit/main/docs/
copyright: "Copyright &copy; 2026 ribod"

docs_dir: docs
site_dir: site
exclude_docs: |
  internal/
  requirements.txt

theme:
  name: material
  variant: classic
  language: en
  logo: assets/img/logo.svg
  favicon: assets/img/logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ribod/chameleon-store-studio
      name: Chameleon Store Studio on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started:
      - Why Store Studio: why.md
      - Requirements: requirements.md
      - Installation: installation.md
      - Quick Start: quickstart.md
      - Core Concepts: concepts.md
  - Gradle Plugin:
      - Annotations: annotations.md
      - Composing Screenshots: composing.md
      - Configuration: configuration.md
      - Rendering: rendering.md
      - Export: export.md
      - Validation: validation.md
      - Store Metadata: metadata.md
      - Baselines & Visual Diff: baselines-and-diff.md
      - HTML Reports: reports.md
      - CI Integration: ci.md
      - Publishing: publishing.md
      - Binary Publishing: binary-publishing.md
      - Multi-Module Projects: multi-module.md
      - Kotlin Multiplatform: multiplatform.md
      - Tasks Reference: tasks.md
  - IDE Plugin:
      - ide/index.md
      - Gallery: ide/gallery.md
      - Store Preview: ide/store-preview.md
      - Changes & Diff: ide/diff.md
      - Validation: ide/validation.md
      - Publishing: ide/publishing.md
      - Settings: ide/settings.md
  - Guides:
      - Adopting in an Existing Project: guides/adoption.md
      - Performance & Caching: guides/performance.md
      - Troubleshooting: guides/troubleshooting.md
      - Samples: guides/samples.md
      - AI Agent Setup Guide: plugin-agent-guides.md
      - FAQ: faq.md
  - Reference:
      - Stability: stability.md
      - Compatibility: compatibility.md
      - Architecture & Design: architecture.md
      - Change Log: changelog.md
      - Contributing: contributing.md
      - License: license.md
