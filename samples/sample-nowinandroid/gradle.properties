# Samples build Store Studio from source (includeBuild("../../")), so the daemon also loads the
# repository's own AGP/KGP plugin stack (~50 MB of metaspace) next to the sample's. Builds that
# apply the published plugin fit in Gradle's default metaspace.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
